name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version, fx 1.0.1"
        required: true
      version_code:
        description: "Android versionCode, fx 2"
        required: true
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#release/}"
            VERSION_CODE="${{ github.run_number }}"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate signing secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || (echo "ANDROID_SIGNING_KEY mangler" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS mangler" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD mangler" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD mangler" && exit 1)
          echo "$SIGNING_KEY" | base64 --decode > app/release.keystore
          echo "ANDROID_SIGNING_STORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: >
          gradle :app:assembleRelease
          -PVERSION_NAME="${{ steps.version.outputs.name }}"
          -PVERSION_CODE="${{ steps.version.outputs.code }}"
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Mig-${{ steps.version.outputs.name }}.apk"
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mig-1.0.0-install
          path: android/app/build/outputs/apk/release/Mig-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.name }}"
          name: "Mig ${{ steps.version.outputs.name }}"
          generate_release_notes: true
          files: "android/app/build/outputs/apk/release/Mig-${{ steps.version.outputs.name }}.apk"
