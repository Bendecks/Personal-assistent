<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praktisk overblik</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17202a;background:#f4f6f7}body{margin:0}.wrap{max-width:760px;margin:auto;padding:24px 16px 48px}h1{font-size:2rem;margin:.2rem 0}.sub{color:#667085;margin:0 0 24px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.tag{display:inline-block;font-size:.78rem;background:#eef2f6;border-radius:999px;padding:4px 9px;margin-bottom:8px}.when{font-weight:700}.done{opacity:.55;text-decoration:line-through}label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}input{width:20px;height:20px;margin-top:2px}a{color:inherit}.footer{margin-top:24px;color:#667085;font-size:.85rem}</style>
</head>
<body><main class="wrap">
<div class="tag">Samtaleoverblik</div><h1>Praktiske ting</h1><p class="sub">Aktuelle opfølgninger fra samtalen. Mandag 31. august 2026.</p>
<section id="tasks">
<div class="card"><label><input type="checkbox" data-id="sackit"><span><span class="tag">Opfølgning</span><br><span class="when">Mandag</span> — Følg op med SACKit kundeservice om metalknapperne på mormors stole.</span></label></div>
<div class="card"><label><input type="checkbox" data-id="bent"><span><span class="tag">Opfølgning</span><br><span class="when">Mandag</span> — Følg op med Bent om strøm og stænkplade.</span></label></div>
<div class="card"><label><input type="checkbox" data-id="jord"><span><span class="tag">Praktisk</span><br>Fyld jord under postkassen.</span></label></div>
<div class="card"><label><input type="checkbox" data-id="elektriker"><span><span class="tag">Opfølgning</span><br><span class="when">Mandag</span> — Følg op på tilbud fra elektriker til strøm i skuret.</span></label></div>
</section>
<p class="footer">Afkrydsninger gemmes lokalt på denne enhed. <a href="./">Til arbejdscentralen</a></p>
</main><script>
const key='praktisk-overblik-2026-08-30';const state=JSON.parse(localStorage.getItem(key)||'{}');document.querySelectorAll('input[data-id]').forEach(x=>{x.checked=!!state[x.dataset.id];x.closest('.card').classList.toggle('done',x.checked);x.addEventListener('change',()=>{state[x.dataset.id]=x.checked;localStorage.setItem(key,JSON.stringify(state));x.closest('.card').classList.toggle('done',x.checked)})});
</script></body></html>
